<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Learning</title>
    <link rel="stylesheet" href="styles-home.css">
</head>
<body>
    <h2 class="heading" id="heading2">Browser Object Model (BOM) Home</h2>
    <ol class="bom-list">
        <li class="bom-section">Window
            <ul id="window-text"></ul>
            <button id="open-window-button" class="button">Google Search</button>
            <button id="print" class="button">Print Page</button>
        </li>
        <li class="bom-section">Document
            <ul id="document-text"></ul>
        </li>
        <li class="bom-section">Screen
            <ul id="screen-text"></ul>
        </li>
        <li class="bom-section">History
            <ul id="history-text"></ul>
        </li>
        <li class="bom-section">Navigator
            <ul id="navigator-text"></ul>
        </li>
        <li class="bom-section">Location
            <ul id="location-text"></ul>
        </li>
        <li class="bom-section">Console
            <ul id="console-text"></ul>
        </li>
    </ol>
    <script src="bom-info.js"></script>
</body>
</html>
