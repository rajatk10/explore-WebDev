<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Details</title>
    <!-- Link to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>User Details</h2>
    <form id="personal-details-form">
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name">
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <button type="submit">Submit</button>
    </form>
    <p class="status-line is-hidden">First Name Status: <span id="first-name-status"></span></p>
    <p class="status-line is-hidden">Last Name Status: <span id="last-name-status"></span></p>
    <p class="status-line is-hidden">Email Status: <span id="email-status"></span></p>
    <p class="status-line is-hidden">Phone Status: <span id="phone-status"></span></p>
    <p class="status-line is-hidden">All Details : <span id="all-details-status"></span></p>
    <!-- Link to the JavaScript file -->
    <script src="validate-user-details.js"></script> 
</body>
</html>
